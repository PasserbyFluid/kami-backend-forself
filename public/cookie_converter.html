            // 添加默认的localStorage数据
            result.localStorage = defaultLocalStorage;
            
            return result;
        }

        function convertCookie() {
            const input = document.getElementById('cookieInput').value.trim();
            const output = document.getElementById('jsonOutput');
            
            if (!input) {
                alert('请输入cookie字符串！');
                return;
            }
            
            try {
                const result = convertCookieStringToFullJSON(input);
                output.value = JSON.stringify(result, null, 2);
            } catch (error) {
                alert('转换失败：' + error.message);
            }
        }

        function clearAll() {
            document.getElementById('cookieInput').value = '';
            document.getElementById('jsonOutput').value = '';
        }

        /**
         * 查询服务器Cookie列表
         */
        async function fetchServerCookies() {
            const container = document.getElementById('cookieListContainer');
            const section = document.getElementById('serverCookiesSection');
            
            try {
                // 显示加载状态
                container.innerHTML = '<div class="loading">正在加载服务器Cookie列表...</div>';
                section.style.display = 'block';
                
                // 调用API获取Cookie列表
                const response = await fetch('http://43.248.188.75:29477/api/cookie/list', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP错误! 状态: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.list || !Array.isArray(data.list)) {
                    throw new Error('返回的数据格式不正确');
                }
                
                // 显示Cookie列表
                displayCookieList(data.list);
                
            } catch (error) {
                container.innerHTML = `<div class="error">获取Cookie列表失败: ${error.message}</div>`;
                section.style.display = 'block';
            }
        }

        /**
         * 显示Cookie列表
         */
        function displayCookieList(cookieList) {
            const container = document.getElementById('cookieListContainer');
            
            if (cookieList.length === 0) {
                container.innerHTML = '<div class="info">服务器上没有找到任何Cookie记录</div>';
                return;
            }
            
            let html = '';
            cookieList.forEach(cookie => {
                const createdAt = cookie.created_at || '未知时间';
                const accountInfo = cookie.account_info || '无账户信息';
                const domain = cookie.domain || '未知域名';
                const domainName = cookie.domain_name || '未知站点';
                
                html += `
                    <div class="cookie-item">
                        <h4>${domainName} (${domain})</h4>
                        <p><strong>账户信息:</strong> ${accountInfo}</p>
                        <p><strong>创建时间:</strong> ${createdAt}</p>
                        <p><strong>ID:</strong> ${cookie.id}</p>
                        ${cookie.cookie ? `<div class="cookie-text"><strong>Cookie内容:</strong><br>${cookie.cookie}</div>` : ''}
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
